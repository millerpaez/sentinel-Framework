name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Once a day. Cron runs in UTC: 01:00 UTC = 20:00 Colombia (UTC-5)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression (e.g. "@monitor"). Empty runs every scenario.'
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # lets the job request the OIDC token that AWS exchanges for temporary credentials

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "22"
          cache: gradle

      - name: Run unit tests and BDD scenarios
        env:
          HEADLESS: "true"
          # Scheduled runs = synthetic monitor (@monitor); manual runs may pass tags; push/PR run everything
          TAGS: ${{ github.event_name == 'schedule' && '@monitor' || inputs.tags || '' }}
        run: |
          if [ -n "$TAGS" ]; then
            echo "Running scenarios with tags: $TAGS"
            ./gradlew test acceptanceTest -Dtags="$TAGS"
          else
            ./gradlew test acceptanceTest
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-reports-${{ github.run_id }}
          path: build/reports
          retention-days: 14

      # AWS steps run only on main (push, schedule, manual): the IAM role trusts only refs/heads/main,
      # and pull requests (possibly from forks) must never reach AWS.
      - name: Configure AWS credentials (OIDC)
        if: always() && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish Cucumber report to S3
        if: always() && github.event_name != 'pull_request'
        env:
          REPORT_BUCKET: ${{ secrets.REPORT_BUCKET }}
        run: |
          if [ ! -d build/reports/cucumber ]; then
            echo "No Cucumber report generated; nothing to publish."
            exit 0
          fi
          aws s3 sync build/reports/cucumber "s3://${REPORT_BUCKET}/runs/${{ github.run_id }}/"
          echo "Report published to s3://${REPORT_BUCKET}/runs/${{ github.run_id }}/" >> "$GITHUB_STEP_SUMMARY"
